# OmniSafe Workshop — Jekyll + Minimal Mistakes configuration
# Replace YOUR-USERNAME and YOUR-REPO-NAME with your actual GitHub username and repo name.

# ============================================================
# Site identity
# ============================================================
title: "OmniSafe Workshop"
title_separator: "—"
subtitle: "Safety, Privacy, and Reliability of Audio-Visual LLMs"
name: "OmniSafe Organizing Committee"
description: "ICLR 2027 Workshop on Safety, Privacy, and Reliability of Audio-Visual LLMs"
url: "https://BriansIDP.github.io"
baseurl: "/OmniSafe-Workshop"  # leave as "" if the repo is USERNAME.github.io itself
repository: "BriansIDP/OmniSafe-Workshop"

# ============================================================
# SEO / Social
# ============================================================
# og_image: "/assets/imgs/og-preview.png"  # optional: add a preview image for link sharing
locale: "en_US"
logo: ""  # optional: path to a logo shown in the masthead, e.g. "/assets/imgs/logo.png"

# ============================================================
# Theme
# ============================================================
# remote_theme: "mmistakes/minimal-mistakes@4.26.2"
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "contrast"  # options: default, air, aqua, contrast, dark, dirt, mint, neon, plum, sunrise

# ============================================================
# Plugins (required for GitHub Pages)
# ============================================================
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# ============================================================
# Navigation
# ============================================================
# Defined here and referenced in _data/navigation.yml (create that file too — see below).

# ============================================================
# Author (used in sidebar if enabled; left blank for workshop sites)
# ============================================================
author:
  name: "OmniSafe Organizing Committee"
  email: "gs534@cam.ac.uk"

# ============================================================
# Footer links
# ============================================================
footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:gs534@cam.ac.uk"

# ============================================================
# Reading / output settings
# ============================================================
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: UTC

# ============================================================
# Defaults
# ============================================================
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      read_time: false
      share: false
      related: false

# ============================================================
# Exclude from build
# ============================================================
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
